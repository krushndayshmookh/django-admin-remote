[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-admin-remote"
version = "0.1.0"
description = "Read and edit a remote Django admin site over HTTP by parsing its stock HTML. Nothing to install on the server."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Krushn Dayshmookh" }]
keywords = ["django", "admin", "client", "scraping", "automation", "inlines", "formset"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.25",
    "beautifulsoup4>=4.9",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/krushndayshmookh/django-admin-remote"
Issues = "https://github.com/krushndayshmookh/django-admin-remote/issues"
Changelog = "https://github.com/krushndayshmookh/django-admin-remote/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/django_admin_remote"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
